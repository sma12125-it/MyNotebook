<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>دفتر من | مدیریت زندگی و سلامت</title>
    <meta name="description" content="سامانه جامع و ساده مدیریت سلامت، داروها، آزمایش‌ها، یادآوری‌ها و رویدادهای مهم زندگی شخصی (دفتر من)" />
    
    <!-- PWA & Apple Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7C9070" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="دفتر من" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Persian Typography Fonts (Vazirmatn & Shabnam font family fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      :root {
        --font-persian: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      body {
        font-family: var(--font-persian);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Safe area support for iPhone */
      .safe-top {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
  </head>
  <body class="bg-[#FDFCF9] dark:bg-[#161D15] text-[#3C3C3B] dark:text-[#E2E8DF] min-h-screen selection:bg-[#7C9070] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration error', err);
          });
        });
      }
    </script>
  </body>
