<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded App Icon Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Notebook / Life OS Book Shape -->
  <g filter="url(#shadow)">
    <!-- Book Base -->
    <rect x="110" y="110" width="292" height="300" rx="28" fill="#ffffff" fill-opacity="0.95" />
    <!-- Book Spine Ribbons (Persian Right-to-Left spine) -->
    <rect x="360" y="110" width="42" height="300" rx="14" fill="#e2e8f0" />
    <line x1="360" y1="110" x2="360" y2="410" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Health Heart & Pulse Symbol -->
    <path d="M220 200 C200 170, 150 180, 150 220 C150 260, 220 310, 220 310 C220 310, 290 260, 290 220 C290 180, 240 170, 220 200 Z" fill="url(#heartGrad)" />
    
    <!-- Pulse Line over heart -->
    <path d="M130 250 L180 250 L195 230 L215 275 L235 220 L250 260 L270 250 L310 250" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Lines of notebook on bottom -->
    <rect x="150" y="340" width="140" height="8" rx="4" fill="#94a3b8" />
    <rect x="150" y="362" width="100" height="8" rx="4" fill="#cbd5e1" />
  </g>
</svg>
